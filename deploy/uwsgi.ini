[uwsgi]
socket = 127.0.0.1:8001
chdir = /www/wwwroot/47.116.120.31/EDC
module = edc.wsgi:application
home = /www/wwwroot/47.116.120.31/venv

# 安全与稳定性
master = true
processes = 10
threads = 1            # 👈 关键修正：避免线程安全问题
uid = www
gid = www

# 资源管理
chmod-socket = 664
vacuum = true
die-on-term = true

# 超时防护
harakiri = 30
harakiri-verbose = true
limit-as = 512         # 内存限制（MB）

# 日志与监控
daemonize = /www/wwwroot/47.116.120.31/EDC/deploy/uwsgi.log
pidfile = /www/wwwroot/47.116.120.31/EDC/deploy/uwsgi.pid
